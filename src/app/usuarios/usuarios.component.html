<div *ngIf="!showError" class="usuarios-content">
  <app-form-usuario
    (newUsuarioEvent)="addUsuario($event)"
    [usuario]="usuarioSelected">
  </app-form-usuario>

  <div class="card form-card shadow-sm my-4 border-0 usuarios-card">
    <div class="card-header my-3 text-center bg-light usuarios-card-header">
      <h5 class="card-title mb-0 usuarios-title">Lista de Usuarios</h5>
    </div>
    <div class="card-body usuarios-card-body">

      <div class="mb-3 usuarios-search">
        <input
          type="text"
          class="custom-tr form-control"
          placeholder="Buscar por DNI"
          [(ngModel)]="dniBusqueda"
          (input)="buscarPorDNI()">
      </div>

      <div *ngIf="usuariosFiltrados.length > 0" class="usuarios-table-container">
        <table class="table table-hover table-striped usuarios-table">
          <thead>
            <tr>
              <th class="custom-tr col-nombre">Nombre</th>
              <th class="custom-tr col-apellido">Apellido</th>
              <th class="custom-tr col-email">Correo electronico</th>
              <th class="custom-tr col-username">Username</th>
              <th class="custom-tr col-rol">Tipo de acceso</th>
              <th class="custom-tr col-editar">Editar</th>
              <th class="custom-tr col-accion">Accion</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let usuario of usuariosFiltrados; trackBy: trackByFn">
              <td class="custom-td col-nombre">{{ usuario.nombre }}</td>
              <td class="custom-td col-apellido">{{ usuario.lastname }}</td>
              <td class="custom-td col-email">{{ usuario.username }}</td>
              <td class="custom-td col-username">{{ getUsernameVisual(usuario) }}</td>
              <td class="custom-td col-rol">{{ usuario.role }}</td>
              <td class="custom-td col-editar">
                <button
                  (click)="onUpdateUsuario(usuario)"
                  class="btn btn-sm btn-secondary custom-button"
                  [disabled]="rowActionLoading[usuario.id]">
                  Editar
                </button>
              </td>
              <td class="custom-td col-accion">
                <button
                  (click)="onToggleBloqueo(usuario)"
                  class="btn btn-sm custom-button"
                  [ngClass]="isUsuarioActivo(usuario) ? 'btn-warning' : 'btn-success'"
                  [disabled]="rowActionLoading[usuario.id]">
                  <span *ngIf="rowActionLoading[usuario.id]" class="spinner-border spinner-border-sm mr-1" role="status" aria-hidden="true"></span>
                  {{ isUsuarioActivo(usuario) ? 'Bloquear' : 'Desbloquear' }}
                </button>
                <div *ngIf="rowActionError[usuario.id]" class="text-danger mt-1 row-error-text">
                  {{ rowActionError[usuario.id] }}
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="usuariosFiltrados.length === 0" class="alert alert-info text-center">
        Lo sentimos, no hay informacion para mostrar
      </div>
    </div>
  </div>
</div>
